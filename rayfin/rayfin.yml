id: fabric-atlas-relations-beta
name: Fabric Atlas Relations Beta
version: 1.13.0-beta.1
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://pearl-sand-f51b67600e-centralus.webapp.fabricapps.net
  data:
    enabled: true
    dialect: mssql
  storage:
    enabled: true
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
  functions:
    enabled: false
