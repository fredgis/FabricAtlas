id: fabricatlas
name: FabricAtlas
version: 1.11.5
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - https://glad-alder-8f53edbdc7-centralus.webapp.fabricapps.net
  data:
    enabled: true
    dialect: mssql
  storage:
    enabled: true
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
  functions:
    enabled: false
