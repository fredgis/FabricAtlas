id: fabric-atlas-fabcon
name: Fabric Atlas FabCon
version: 2.0.0-alpha.1
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
  data:
    enabled: true
    dialect: mssql
  storage:
    enabled: true
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
  functions:
    enabled: true
    path: rayfin/functions
    buildCommand: npm run build
    auth:
      type: application
