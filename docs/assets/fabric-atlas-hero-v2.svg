<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc" data-version="2">
  <title id="title">Fabric Atlas</title>
  <desc id="desc">Open-source governance, lineage and access for Microsoft Fabric workspaces.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1117"/>
      <stop offset="0.52" stop-color="#111b24"/>
      <stop offset="1" stop-color="#0a1820"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3d0"/>
      <stop offset="1" stop-color="#1677c8"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.52" stop-color="#5cb3ff"/>
      <stop offset="1" stop-color="#22d3d0"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="42%" r="55%">
      <stop offset="0" stop-color="#1677c8" stop-opacity="0.22"/>
      <stop offset="0.48" stop-color="#22d3d0" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0b1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#88a2b5" stroke-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="lineGlow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#54c8e8"/>
    </marker>
  </defs>

  <rect width="1600" height="500" rx="28" fill="url(#background)"/>
  <rect width="1600" height="500" rx="28" fill="url(#grid)"/>
  <rect width="1600" height="500" rx="28" fill="url(#glow)"/>
  <path d="M0 430C240 350 360 470 590 400C830 326 1030 446 1250 374C1390 328 1494 348 1600 304V500H0Z" fill="#071016" fill-opacity="0.65"/>

  <g transform="translate(86 76)">
