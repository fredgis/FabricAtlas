        <rect x="12" y="11" width="36" height="36" rx="9" fill="#d9a520"/>
        <text x="30" y="34" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">SM</text>
        <text x="58" y="25" fill="#f7f9fb" font-size="12" font-weight="650">Model</text>
        <text x="58" y="42" fill="#7f95a5" font-size="9">SEMANTIC</text>
      </g>
      <g transform="translate(726 122)">
        <rect width="150" height="58" rx="14" fill="#17212b" stroke="#eab308"/>
        <rect x="12" y="11" width="36" height="36" rx="9" fill="#eab308"/>
        <text x="30" y="34" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">RP</text>
        <text x="58" y="25" fill="#f7f9fb" font-size="12" font-weight="650">Report</text>
        <text x="58" y="42" fill="#7f95a5" font-size="9">CONSUME</text>
