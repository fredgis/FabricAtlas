      <path d="M345 218C357 218 362 151 378 151"/>
      <path d="M523 151C535 151 540 218 556 218"/>
      <path d="M699 218C711 218 716 151 734 151"/>
      <path d="M699 218C717 218 716 298 734 298"/>
