    <g transform="translate(376 344)">
      <rect width="454" height="58" rx="16" fill="#0f1820" stroke="#35414a"/>
      <circle cx="25" cy="29" r="6" fill="#38d18b"/>
      <text x="44" y="25" fill="#f7f9fb" font-size="13" font-weight="650">One workspace. One trusted snapshot.</text>
      <text x="44" y="43" fill="#7f95a5" font-size="11">Catalog · lineage · access · jobs · team context</text>
