    <path d="M38 16L59 28V52L38 64L17 52V28L38 16Z" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M28 48L34 31L51 27L45 44L28 48Z" fill="none" stroke="#fff" stroke-width="2.8" stroke-linejoin="round"/>
    <circle cx="39" cy="38" r="3.5" fill="#fff"/>
  </g>

  <text x="184" y="121" fill="#f7f9fb" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-1.8">Fabric Atlas</text>
  <text x="88" y="188" fill="#b7c6d1" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400">Governance map for Microsoft Fabric workspaces</text>
  <text x="88" y="231" fill="#7f95a5" font-family="Segoe UI, Arial, sans-serif" font-size="17">Metadata only. Fabric native. Built with React and Rayfin.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650">
